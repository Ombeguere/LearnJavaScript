<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tempretaure conversion</title>

    <link rel = "stylesheet" href = "temp.css">
</head>
<body>
    
    <div class = "card">

        <h3>Temperature conversion:</h3>
        <input type = "text" id = "temp" placeholder = "Enter temperature"><br>

        <input type="radio" id = "celfahr" name = "typeConv">
        <label for = "celfahr">Celsius to Fahrenheit</label><br>

        <input type = "radio" id = "fahrCel" name = "typeConv">
        <label for = "fahrCel">Fahrenheit to Celsius</label><br>

        <button type = "submit" id = "mybutton">Submit</button>

        <h3 id = "result">Please select a convertion mode</h3>

    </div>


    <script src = "temp.js"></script>
</body>
</html>
